name: LR5 Security Audit

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:

  dependency-audit:
    name: Dependency Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Create results directory
        run: mkdir -p security-results

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: python -m pip install --upgrade pip-audit

      - name: Audit Python dependencies
        continue-on-error: true
        run: |
          pip-audit \
            -r backend/requirements.railway.txt \
            --format json \
            --output security-results/pip-audit.json || true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Audit frontend dependencies
        continue-on-error: true
        run: |
          cd frontend
          npm audit --json > ../security-results/npm-audit.json || true

      - name: Upload dependency audit results
        uses: actions/upload-artifact@v4
        with:
          name: dependency-security-results
          path: security-results/
          if-no-files-found: warn


  zap-baseline:
    name: OWASP ZAP Baseline Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Scan public KnowledgeHub
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: "https://knowledgehub-production-6644.up.railway.app"
          fail_action: false
          allow_issue_writing: false
          artifact_name: knowledgehub-zap-report
          cmd_options: "-a"


  summary:
    name: Security Audit Summary
    runs-on: ubuntu-latest
    needs:
      - dependency-audit
      - zap-baseline
    if: always()

    steps:
      - name: Create summary
        run: |
          echo "# KnowledgeHub — Laboratory Work №5" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Security testing completed with:" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- OWASP ZAP Baseline" >> "$GITHUB_STEP_SUMMARY"
          echo "- pip-audit" >> "$GITHUB_STEP_SUMMARY"
          echo "- npm audit" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Target: https://knowledgehub-production-6644.up.railway.app" >> "$GITHUB_STEP_SUMMARY"

